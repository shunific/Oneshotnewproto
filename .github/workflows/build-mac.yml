name: Build macOS Release

on:
  workflow_dispatch: # Allows one-click manual trigger from GitHub Actions tab
  push:
    branches:
      - local-machine-main-tester1
      - main
    paths:
      - 'electron/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/build-mac.yml'

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild Native Dependencies (macOS)
        run: npm run rebuild

      - name: Build Web Assets
        run: npm run build

      - name: Ensure Environment Resource
        run: |
          if [ ! -f .env.tester1 ]; then
            echo "VITE_SUPABASE_URL=https://olywhyaozjlkjrnsdydg.supabase.co" > .env.tester1
            echo "VITE_SUPABASE_SERVICE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9seXdoeWFvempsa2pybnNkeWRnIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4OTg5NjAxNCwiZXhwIjoyMTA1NDcyMDE0fQ.9M87B5oO8bKLtkaH5MIpzZ1KzvhE3qr6y5GApWzStn4" >> .env.tester1
            echo "SQLITE_DB_PATH=oneshot-tester1.db" >> .env.tester1
          fi

      - name: Build macOS Electron Package (.dmg & .zip)
        run: npx electron-builder --mac -c.mac.identity=null
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OneShot-macOS-Installer
          path: |
            release/*.dmg
            release/*.zip
          retention-days: 30
