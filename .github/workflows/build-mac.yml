name: Build macOS Release

on:
  workflow_dispatch: # Allows one-click manual trigger from GitHub Actions tab
  push:
    branches:
      - local-machine-main-tester1
    paths:
      - 'electron/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/build-mac.yml'

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild Native Dependencies (macOS)
        run: npm run rebuild

      - name: Build Web Assets
        run: npm run build

      - name: Build macOS Electron Package (.dmg & .zip)
        run: npx electron-builder --mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OneShot-macOS-Installer
          path: |
            release/*.dmg
            release/*.zip
          retention-days: 30
